<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solid Money App Admins</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Lockscreen styles */
        #lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }

        .lock-container {
            text-align: center;
            max-width: 320px;
            width: 90%;
            padding: 20px;
        }

        .lock-container h2 {
            margin-bottom: 8px;
            font-size: 24px;
            color: #111;
        }

        .lock-container p {
            margin-bottom: 24px;
            color: #666;
            font-size: 14px;
        }

        .pin-input-container {
            position: relative;
            margin-bottom: 20px;
        }

        #pin-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 22px;
            font-family: monospace;
            letter-spacing: 4px;
            text-align: center;
            border: 2px solid #cbd5e0;
            border-radius: 12px;
            outline: none;
            background-color: #f7fafc;
            transition: border-color 0.2s;
        }

        #pin-input:focus {
            border-color: #00b09b;
        }

        .submit-btn {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 176, 155, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        #error-message {
            color: #ff3b30;
            font-size: 13px;
            margin-top: 16px;
            height: 18px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        #error-message.visible {
            opacity: 1;
        }

        /* Mobile App Container Frame */
        .mobile-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            background-color: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            border-radius: 0;
            display: none; /* Hidden until unlocked */
        }

        @media (min-width: 401px) {
            .mobile-container {
                border-radius: 40px;
                border: 12px solid #1a1a1a;
            }
        }

        /* App Header */
        .app-header {
            padding: 30px 20px 20px 20px;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            text-align: center;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
        }

        .app-header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .app-header p {
            font-size: 12px;
            color: #a0aec0;
            margin-top: 6px;
        }

        /* App Content Body */
        .app-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Action Button */
        .otp-btn {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 176, 155, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
            max-width: 260px;
        }

        .otp-btn:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(0, 176, 155, 0.3);
        }

        /* Modal Pop-up Styling */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #ffffff;
            width: 85%;
            max-width: 300px;
            padding: 24px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .modal-card h3 {
            font-size: 16px;
            color: #4a5568;
            margin-bottom: 12px;
        }

        .otp-display {
            font-family: monospace;
            font-size: 26px;
            font-weight: 700;
            color: #2d3748;
            background: #f7fafc;
            padding: 12px;
            border-radius: 10px;
            letter-spacing: 2px;
            border: 1px dashed #cbd5e0;
            margin-bottom: 20px;
        }

        .close-btn {
            background-color: #e2e8f0;
            color: #4a5568;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .close-btn:hover {
            background-color: #cbd5e0;
        }

        /* App Footer */
        .app-footer {
            padding: 15px;
            text-align: center;
            font-size: 11px;
            color: #a0aec0;
            border-top: 1px solid #edf2f7;
        }
    </style>
</head>
<body>

    <!-- LOCK SCREEN OVERLAY -->
    <div id="lock-screen">
        <div class="lock-container">
            <h2>Enter Security PIN</h2>
            <p>For Admins access</p>
            
            <div class="pin-input-container">
                <input type="password" id="pin-input" maxlength="6" placeholder="------" autocomplete="off">
            </div>

            <button class="submit-btn" id="submitPinBtn">Unlock</button>

            <div id="error-message">Incorrect PIN. Try again.</div>
        </div>
    </div>

    <div class="mobile-container" id="mobile-container">
        <!-- Header -->
        <div class="app-header">
            <h1>Solid Money App Admins</h1>
            <p>Secure Portal Dashboard</p>
        </div>

        <!-- Main Body -->
        <div class="app-body">
            <button class="otp-btn" id="otpBtn">App Access OTP</button>
        </div>

        <!-- Footer -->
        <div class="app-footer">
            &copy;All rights reserved SMGC PVT LTD
        </div>

        <!-- Pop-up Modal -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-card">
                <h3>Your Access OTP</h3>
                <div class="otp-display" id="otpDisplay">YYYYMMDDHH</div>
                <button class="close-btn" id="closeBtn">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Lock Screen Logic (Standard Keyboard input)
        const pinInput = document.getElementById('pin-input');
        const submitPinBtn = document.getElementById('submitPinBtn');

        function getExpectedPin() {
            const now = new Date();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return "1406" + minutes;
        }

        function validatePin() {
            const enteredPin = pinInput.value;
            const expectedPin = getExpectedPin();
            
            if (enteredPin === expectedPin) {
                unlockApp();
            } else {
                showError();
                setTimeout(() => {
                    pinInput.value = "";
                }, 400);
            }
        }

        submitPinBtn.addEventListener('click', validatePin);
        
        pinInput.addEventListener('keypress', (e) => {
            hideError();
            if (e.key === 'Enter') {
                validatePin();
            }
        });

        pinInput.addEventListener('input', () => {
            hideError();
        });

        function unlockApp() {
            const lockScreen = document.getElementById("lock-screen");
            const mobileContainer = document.getElementById("mobile-container");

            lockScreen.style.opacity = "0";
            setTimeout(() => {
                lockScreen.style.display = "none";
                mobileContainer.style.display = "flex";
            }, 300);
        }

        function showError() {
            const errorMsg = document.getElementById("error-message");
            errorMsg.classList.add("visible");
        }

        function hideError() {
            const errorMsg = document.getElementById("error-message");
            errorMsg.classList.remove("visible");
        }

        // Dashboard Modal Logic
        const otpBtn = document.getElementById('otpBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const closeBtn = document.getElementById('closeBtn');
        const otpDisplay = document.getElementById('otpDisplay');

        // Function to generate YYYYMMDDHH format based on real-time clock
        function generateOTP() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');

            return `${year}${month}${day}${hours}`;
        }

        // Event listener to open modal and populate real-time OTP
        otpBtn.addEventListener('click', () => {
            const realTimeOTP = generateOTP();
            otpDisplay.textContent = realTimeOTP;
            modalOverlay.classList.add('active');
        });

        // Event listener to close modal
        closeBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
        });

        // Close modal if clicking outside the card area
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
            }
        });
    </script>
</body>
</html>
