<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solid Money App Admins</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Lockscreen styles */
        #lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }

        .lock-container {
            text-align: center;
            max-width: 320px;
            width: 90%;
            padding: 20px;
        }

        .lock-container h2 {
            margin-bottom: 8px;
            font-size: 24px;
            color: #111;
        }

        .lock-container p {
            margin-bottom: 24px;
            color: #666;
            font-size: 14px;
        }

        .pin-input-container {
            position: relative;
            margin-bottom: 20px;
        }

        #pin-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 22px;
            font-family: monospace;
            letter-spacing: 4px;
            text-align: center;
            border: 2px solid #cbd5e0;
            border-radius: 12px;
            outline: none;
            background-color: #f7fafc;
            transition: border-color 0.2s;
        }

        #pin-input:focus {
            border-color: #00b09b;
        }

        .submit-btn {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 176, 155, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        #error-message {
            color: #ff3b30;
            font-size: 13px;
            margin-top: 16px;
            height: 18px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        #error-message.visible {
            opacity: 1;
        }

        /* Mobile App Container Frame */
        .mobile-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            background-color: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            border-radius: 0;
            display: none; /* Hidden until unlocked */
        }

        @media (min-width: 401px) {
            .mobile-container {
                border-radius: 40px;
                border: 12px solid #1a1a1a;
            }
        }

        /* App Header */
        .app-header {
            padding: 30px 20px 20px 20px;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            text-align: center;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
        }

        .app-header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .app-header p {
            font-size: 12px;
            color: #a0aec0;
            margin-top: 6px;
        }

        /* App Content Body */
        .app-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 25px;
        }

        /* Action Button */
        .otp-btn {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 176, 155, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
            max-width: 260px;
        }

        .otp-btn:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(0, 176, 155, 0.3);
        }

        /* Number of Users Display Widget */
        .users-widget {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            padding: 14px 24px;
            border-radius: 16px;
            text-align: center;
            width: 100%;
            max-width: 260px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
        }

        .users-widget:hover {
            background-color: #edf2f7;
        }

        .users-widget .label {
            font-size: 12px;
            color: #718096;
            font-weight: 500;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .users-widget .count {
            font-size: 22px;
            font-weight: 700;
            color: #2d3748;
        }

        /* Modal Pop-up Styling */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #ffffff;
            width: 85%;
            max-width: 300px;
            padding: 24px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .modal-card h3 {
            font-size: 16px;
            color: #4a5568;
            margin-bottom: 12px;
        }

        .otp-display {
            font-family: monospace;
            font-size: 26px;
            font-weight: 700;
            color: #2d3748;
            background: #f7fafc;
            padding: 12px;
            border-radius: 10px;
            letter-spacing: 2px;
            border: 1px dashed #cbd5e0;
            margin-bottom: 20px;
        }

        /* Edit Count Modal Inputs */
        .edit-input {
            width: 100%;
            padding: 10px;
            font-size: 18px;
            text-align: center;
            border: 2px solid #cbd5e0;
            border-radius: 10px;
            outline: none;
            margin-bottom: 15px;
        }

        .edit-input:focus {
            border-color: #00b09b;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .close-btn, .save-btn {
            background-color: #e2e8f0;
            color: #4a5568;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .save-btn {
            background-color: #00b09b;
            color: white;
        }

        .close-btn:hover {
            background-color: #cbd5e0;
        }

        .save-btn:hover {
            background-color: #009688;
        }

        /* App Footer */
        .app-footer {
            padding: 15px;
            text-align: center;
            font-size: 11px;
            color: #a0aec0;
            border-top: 1px solid #edf2f7;
        }
    </style>
</head>
<body>

    <!-- LOCK SCREEN OVERLAY -->
    <div id="lock-screen">
        <div class="lock-container">
            <h2>Enter Security PIN</h2>
            <p>For Admins Access</p>
            
            <div class="pin-input-container">
                <input type="password" id="pin-input" maxlength="6" placeholder="------" autocomplete="off">
            </div>

            <button class="submit-btn" id="submitPinBtn">Unlock</button>

            <div id="error-message">Incorrect PIN. Try again.</div>
        </div>
    </div>

    <div class="mobile-container" id="mobile-container">
        <!-- Header -->
        <div class="app-header">
            <h1>Solid Money App Admins</h1>
            <p>Secure Portal Dashboard</p>
        </div>

        <!-- Main Body -->
        <div class="app-body">
            <button class="otp-btn" id="otpBtn">App Access OTP</button>
            
            <!-- Number of Users Widget -->
            <div class="users-widget" id="usersWidget">
                <div class="label">Number of Users</div>
                <div class="count" id="userCountDisplay">0</div>
            </div>
        </div>

        <!-- Footer -->
        <div class="app-footer">
            &copy;All rights reserved SMGC PVT LTD
        </div>

        <!-- OTP Pop-up Modal -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-card">
                <h3>Your Access OTP</h3>
                <div class="otp-display" id="otpDisplay">MMHHDD</div>
                <button class="close-btn" id="closeBtn">Close</button>
            </div>
        </div>

        <!-- Edit Count Pop-up Modal -->
        <div class="modal-overlay" id="editModalOverlay">
            <div class="modal-card">
                <h3>Edit Users Count</h3>
                <input type="number" id="editCountInput" class="edit-input" min="0">
                <div class="modal-buttons">
                    <button class="close-btn" id="cancelEditBtn">Cancel</button>
                    <button class="save-btn" id="saveEditBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Lock Screen Logic
        const pinInput = document.getElementById('pin-input');
        const submitPinBtn = document.getElementById('submitPinBtn');

        function getExpectedPin() {
            const now = new Date();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return "4095" + minutes;
        }

        function validatePin() {
            const enteredPin = pinInput.value;
            const expectedPin = getExpectedPin();
            
            if (enteredPin === expectedPin) {
                unlockApp();
            } else {
                showError();
                setTimeout(() => {
                    pinInput.value = "";
                }, 400);
            }
        }

        submitPinBtn.addEventListener('click', validatePin);
        
        pinInput.addEventListener('keypress', (e) => {
            hideError();
            if (e.key === 'Enter') {
                validatePin();
            }
        });

        pinInput.addEventListener('input', () => {
            hideError();
        });

        function unlockApp() {
            const lockScreen = document.getElementById("lock-screen");
            const mobileContainer = document.getElementById("mobile-container");

            lockScreen.style.opacity = "0";
            setTimeout(() => {
                lockScreen.style.display = "none";
                mobileContainer.style.display = "flex";
            }, 300);
        }

        function showError() {
            const errorMsg = document.getElementById("error-message");
            errorMsg.classList.add("visible");
        }

        function hideError() {
            const errorMsg = document.getElementById("error-message");
            errorMsg.classList.remove("visible");
        }

        // Dashboard & User Count State
        let userCount = localStorage.getItem('appUserCount') ? parseInt(localStorage.getItem('appUserCount')) : 0;
        const userCountDisplay = document.getElementById('userCountDisplay');
        userCountDisplay.textContent = userCount;

        const otpBtn = document.getElementById('otpBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const closeBtn = document.getElementById('closeBtn');
        const otpDisplay = document.getElementById('otpDisplay');

        const usersWidget = document.getElementById('usersWidget');
        const editModalOverlay = document.getElementById('editModalOverlay');
        const editCountInput = document.getElementById('editCountInput');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const saveEditBtn = document.getElementById('saveEditBtn');

        // Function to generate strict MMHHDD format (Minute, Minute, Hour, Hour, Day, Day)
        function generateOTP() {
            const now = new Date();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');

            return `${minutes}${hours}${day}`;
        }

        // Increment user count and show OTP modal when clicking button
        otpBtn.addEventListener('click', () => {
            userCount++;
            userCountDisplay.textContent = userCount;
            localStorage.setItem('appUserCount', userCount);

            const realTimeOTP = generateOTP();
            otpDisplay.textContent = realTimeOTP;
            modalOverlay.classList.add('active');
        });

        // Close OTP modal
        closeBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
        });

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
            }
        });

        // Hold-to-edit logic (5 seconds / 5000ms) for the users widget
        let holdTimer = null;

        function startHold(e) {
            holdTimer = setTimeout(() => {
                editCountInput.value = userCount;
                editModalOverlay.classList.add('active');
            }, 5000);
        }

        function cancelHold() {
            if (holdTimer) {
                clearTimeout(holdTimer);
                holdTimer = null;
            }
        }

        // Mouse Events
        usersWidget.addEventListener('mousedown', startHold);
        usersWidget.addEventListener('mouseup', cancelHold);
        usersWidget.addEventListener('mouseleave', cancelHold);

        // Touch Events for Mobile
        usersWidget.addEventListener('touchstart', startHold);
        usersWidget.addEventListener('touchend', cancelHold);
        usersWidget.addEventListener('touchcancel', cancelHold);

        // Save new edited count
        saveEditBtn.addEventListener('click', () => {
            const val = parseInt(editCountInput.value);
            if (!isNaN(val) && val >= 0) {
                userCount = val;
                userCountDisplay.textContent = userCount;
                localStorage.setItem('appUserCount', userCount);
            }
            editModalOverlay.classList.remove('active');
        });

        cancelEditBtn.addEventListener('click', () => {
            editModalOverlay.classList.remove('active');
        });

        editModalOverlay.addEventListener('click', (e) => {
            if (e.target === editModalOverlay) {
                editModalOverlay.classList.remove('active');
            }
        });
    </script>
</body>
</html>
